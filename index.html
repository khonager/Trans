<!DOCTYPE html>
<html>

<head>
  <base href="/Trans/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Public transit companion app">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trans">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/svg+xml" href="trans-dark.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="trans-light.svg" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png" />

  <title>Trans</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script checks to see if a redirect is present in the query string,
    // converts it back into the correct url and adds it to the
    // browser's history using window.history.replaceState(...),
    // which won't cause the browser to attempt to load the new url.
    // When the single page app is loaded further down in this file,
    // the correct url will be waiting in the browser's history for
    // the single page app to route accordingly.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <!-- End Single Page Apps for GitHub Pages -->
</head>

<body>
  <div class="loading-container">
    <div class="loading-icon-wrapper">
      <picture class="loading-icon">
        <source srcset="trans-light.svg" media="(prefers-color-scheme: dark)">
        <img src="trans-dark.svg" class="loading-icon" alt="Trans" />
      </picture>
      <div class="loading-bar">
        <div class="loading-bar-inner"></div>
      </div>
    </div>
    <div class="loading-text">Trans</div>
  </div>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .loading-icon-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loading-icon {
      width: 100px;
      height: 100px;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .loading-bar {
      width: 120px;
      height: 6px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .loading-bar-inner {
      height: 100%;
      width: 40%;
      background: #5bcefa;
      border-radius: 3px;
      animation: slide 1.4s ease-in-out infinite;
    }

    .loading-text {
      color: #5bcefa;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: fade 1.4s ease-in-out infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes slide {
      0% {
        transform: translateX(-100%);
      }

      50% {
        transform: translateX(150%);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    @keyframes fade {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
      }

      .loading-bar {
        background: rgba(255, 255, 255, 0.1);
      }
    }
  </style>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
