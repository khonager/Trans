workflows:
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      groups:
        # You'll create this group in Codemagic UI with your secrets
        - app_store_credentials

      vars:
        # Replace with your actual values
        BUNDLE_ID: "de.khonager.trans.ios"
        APP_STORE_APP_ID: "YOUR_APP_ID" # Get from App Store Connect (numeric ID)

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Create .env file
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SUPPORT_EMAIL=$SUPPORT_EMAIL" >> .env

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Preflight signing + env diagnostics
        script: |
          set -euo pipefail

          echo "== Checking required environment variables =="
          required_vars=(
            APP_STORE_CONNECT_PRIVATE_KEY
            APP_STORE_CONNECT_KEY_IDENTIFIER
            APP_STORE_CONNECT_ISSUER_ID
            SUPABASE_URL
            SUPABASE_ANON_KEY
            SUPPORT_EMAIL
          )

          missing=0
          for v in "${required_vars[@]}"; do
            if [[ -z "${!v:-}" ]]; then
              echo "❌ Missing env var: $v"
              missing=1
            else
              echo "✅ $v is set"
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "FATAL: One or more required env vars are missing."
            exit 1
          fi

          echo "== Checking installed provisioning profiles =="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          ls -la "$PROFILE_DIR" || true

          if [[ ! -d "$PROFILE_DIR" ]] || [[ -z "$(ls -A "$PROFILE_DIR" 2>/dev/null)" ]]; then
            echo "❌ No provisioning profiles installed."
            echo "FATAL: Upload App Store .mobileprovision in Codemagic provisioning profiles."
            exit 1
          fi

          echo "== Looking for bundle id in installed profiles =="
          found_bundle=0
          for f in "$PROFILE_DIR"/*.mobileprovision; do
            [[ -e "$f" ]] || continue
            if security cms -D -i "$f" | grep -q "de.khonager.trans.ios"; then
              echo "✅ Matching profile contains bundle id in: $(basename "$f")"
              found_bundle=1
            fi
          done

          if [[ "$found_bundle" -eq 0 ]]; then
            echo "❌ No installed profile appears to match bundle id de.khonager.trans.ios"
            echo "FATAL: Wrong provisioning profile uploaded (or wrong app id)."
            exit 1
          fi

          echo "✅ Preflight checks passed"

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - YOUR_EMAIL@example.com
        notify:
          success: true
          failure: true

      app_store_connect:
        # Uses credentials from app_store_credentials group
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

        # Submit to TestFlight only (not App Store review)
        submit_to_testflight: true
        submit_to_app_store: false

  ios-development:
    name: iOS Development Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true

    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "de.khonager.trans.ios"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Create .env file
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SUPPORT_EMAIL=$SUPPORT_EMAIL" >> .env

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build iOS without signing (for testing)
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
