workflows:
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.khonager.trans.ios

      groups:
        # You'll create this group in Codemagic UI with your secrets
        - app_store_credentials

      vars:
        BUNDLE_ID: "de.khonager.trans.ios"
        APP_STORE_APP_ID: "6760699168"

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Create .env file
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SUPPORT_EMAIL=$SUPPORT_EMAIL" >> .env
          echo "PORTFOLIO_BRIDGE_BASE_URL=$PORTFOLIO_BRIDGE_BASE_URL" >> .env

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Validate App Store Connect app and align build number
        script: |
          set -e

          # Fail early with a clearer message if the API key cannot see this app record.
          app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" \
            --platform=IOS >/dev/null

          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          PUBSPEC_BUILD_NAME="${PUBSPEC_VERSION%%+*}"
          PUBSPEC_BUILD_NUMBER="${PUBSPEC_VERSION##*+}"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APP_ID" \
            --platform=IOS \
            --app-store-version="$PUBSPEC_BUILD_NAME" 2>/dev/null || true)

          if [ -n "$LATEST_BUILD_NUMBER" ] && [ "$LATEST_BUILD_NUMBER" -ge "$PUBSPEC_BUILD_NUMBER" ]; then
            NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
            sed -i.bak "s/^version: .*/version: ${PUBSPEC_BUILD_NAME}+${NEXT_BUILD_NUMBER}/" pubspec.yaml
            rm -f pubspec.yaml.bak
            echo "Raised iOS build number to ${NEXT_BUILD_NUMBER} to avoid App Store Connect conflicts."
          fi

      - name: Flutter build ipa
        script: |
          # iOS project only has the default Runner scheme.
          # Remove implicit Flutter flavor from pubspec for this CI build.
          awk '!/^[[:space:]]*default-flavor:[[:space:]]*stable[[:space:]]*$/' pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml
          flutter build ipa --release \
            --no-tree-shake-icons \
            --build-name=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//') \
            --build-number=$(grep '^version:' pubspec.yaml | sed 's/.*+//') \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - support@khonager.de
        notify:
          success: true
          failure: true

      app_store_connect:
        # Uses credentials from app_store_credentials group
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

        # Upload to App Store Connect, but don't auto-submit for external
        # TestFlight review until Beta App Information is filled in there.
        submit_to_testflight: false
        submit_to_app_store: false

  ios-development:
    name: iOS Development Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true

    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "de.khonager.trans.ios"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Create .env file
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SUPPORT_EMAIL=$SUPPORT_EMAIL" >> .env
          echo "PORTFOLIO_BRIDGE_BASE_URL=$PORTFOLIO_BRIDGE_BASE_URL" >> .env

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build iOS without signing (for testing)
        script: |
          # iOS project only has the default Runner scheme.
          # Remove implicit Flutter flavor from pubspec for this CI build.
          awk '!/^[[:space:]]*default-flavor:[[:space:]]*stable[[:space:]]*$/' pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
