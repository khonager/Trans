name: Trans TestFlight

on:
  workflow_dispatch:
  push:
    branches: [unstable]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'pubspec_overrides.yaml'
      - 'l10n.yaml'
      - '.metadata'
      - '.github/workflows/ios_build.yml'

permissions:
  contents: read

concurrency:
  group: trans-testflight
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/unstable'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Xcode and iPhone SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Restore app configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          PORTFOLIO_BRIDGE_BASE_URL: ${{ secrets.PORTFOLIO_BRIDGE_BASE_URL }}
        run: |
          umask 077
          for key in SUPABASE_URL SUPABASE_ANON_KEY SUPPORT_EMAIL PORTFOLIO_BRIDGE_BASE_URL; do
            printf '%s=%s\n' "$key" "${!key}"
          done > .env

      - name: Prepare Runner and install dependencies
        run: |
          # Android uses stable as its default flavor. iOS has only the Runner scheme.
          sed -i '' '/^[[:space:]]*default-flavor:[[:space:]]*stable[[:space:]]*$/d' pubspec.yaml
          flutter pub get
          cd ios
          pod install

      - name: Install signing tools
        run: pipx install codemagic-cli-tools==0.73.0

      - name: Select build number
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          version=$(ruby -ryaml -e "puts YAML.load_file('pubspec.yaml').fetch('version')")
          name=${version%+*}
          base=${version##*+}
          latest=$(app-store-connect get-latest-build-number 6760699168 --platform IOS --version-string "$name")
          [[ "$base" =~ ^[0-9]+$ && "${latest:-0}" =~ ^[0-9]+([.][0-9]+){0,2}$ ]]
          major=${latest%%.*}
          next=$(( ${major:-0} + 1 ))
          (( next >= base )) || next=$base
          # Reserve a distinct floor per run. A rerun also gets a fresh attempt component.
          (( next >= 54 + GITHUB_RUN_NUMBER )) || next=$((54 + GITHUB_RUN_NUMBER))
          echo "BUILD_NAME=$name" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$next.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Configure temporary keychain and Runner signing
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          umask 077
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE" | base64 -D > "$profiles/Trans.mobileprovision"
          printf '%s' "$CERT" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          keychain initialize
          keychain add-certificates --certificate "$RUNNER_TEMP/distribution.p12" --certificate-password @env:CERTIFICATE_PASSWORD
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Archive and export signed Runner
        run: |
          flutter build ipa --release --no-tree-shake-icons \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

      - name: Verify IPA and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          [[ ${#ipas[@]} == 1 ]] || { echo "::error::Expected one IPA, found ${#ipas[@]}"; exit 1; }
          plist="$RUNNER_TEMP/Runner-Info.plist"
          unzip -p "${ipas[0]}" 'Payload/*.app/Info.plist' > "$plist"
          [[ $(plutil -extract CFBundleIdentifier raw "$plist") == de.khonager.trans.ios ]]
          [[ $(plutil -extract CFBundleShortVersionString raw "$plist") == "$BUILD_NAME" ]]
          [[ $(plutil -extract CFBundleVersion raw "$plist") == "$BUILD_NUMBER" ]]
          umask 077
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "${ipas[0]}" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded Trans $BUILD_NAME ($BUILD_NUMBER) to TestFlight." >> "$GITHUB_STEP_SUMMARY"
