name: Dev Android Build

on:
  push:
    branches: [ "unstable" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Dev APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      # Make dev APK a separate app (like Chrome Canary)
      - name: Set Dev Application ID
        run: |
          # Change applicationId to .dev suffix
          sed -i 's/applicationId = "com.example.trans"/applicationId = "com.example.trans.dev"/' android/app/build.gradle.kts
          # Change app label to "Trans Dev"
          sed -i 's/android:label="trans"/android:label="Trans Dev"/' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=IS_DEV=true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Sign APK
        run: |
          BUILD_TOOLS_PATH=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          
          APK_PATH=$(find build/app/outputs -name "*-release.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found"
            exit 1
          fi
          
          KEY_ALIAS=$(echo "${{ secrets.ANDROID_KEY_ALIAS }}" | tr -d '\r' | tr -d '\n')
          KS_PASS=$(echo "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | tr -d '\r' | tr -d '\n')
          KEY_PASS=$(echo "${{ secrets.ANDROID_KEY_PASSWORD }}" | tr -d '\r' | tr -d '\n')

          $BUILD_TOOLS_PATH/apksigner sign \
            --ks release-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            "$APK_PATH"

          # Rename with -dev and build number
          APK_DIR=$(dirname "$APK_PATH")
          mv "$APK_PATH" "$APK_DIR/trans-dev.apk"
          echo "SIGNED_APK_PATH=$APK_DIR/trans-dev.apk" >> $GITHUB_ENV

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: trans-dev-${{ github.run_number }}
          path: ${{ env.SIGNED_APK_PATH }}

      - name: Delete Old Dev Release
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 0
          delete_tag_pattern: dev-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          prerelease: true
          files: ${{ env.SIGNED_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
