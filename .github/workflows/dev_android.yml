name: Dev Android Build

on:
  push:
    branches: ["unstable"]
  workflow_dispatch:

concurrency:
  group: trans-dev-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/unstable'
    name: Build Dev APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "PORTFOLIO_BRIDGE_BASE_URL=${{ secrets.PORTFOLIO_BRIDGE_BASE_URL }}" >> .env

      - name: Prepare development version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([^+]*\)+.*$/\1/p' pubspec.yaml)
          test -n "$version"
          echo "DEV_VERSION=$version-dev.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          # Keep development codes above historical pubspec build numbers.
          echo "DEV_BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --flavor unstable --dart-define=IS_DEV=true \
            --build-name "$DEV_VERSION" --build-number "$DEV_BUILD_NUMBER"

      - name: Debug Build Output on Failure
        if: failure()
        run: |
          echo "Listing all apk files on runner:"
          find /home/runner/work -name "*.apk" || true
          echo "Listing root build directory:"
          ls -R build || true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Sign APK
        run: |
          BUILD_TOOLS_PATH=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)

          APK_PATH=build/app/outputs/flutter-apk/app-unstable-release.apk
          test -s "$APK_PATH"

          KEY_ALIAS=$(echo "${{ secrets.ANDROID_KEY_ALIAS }}" | tr -d '\r' | tr -d '\n')
          KS_PASS=$(echo "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | tr -d '\r' | tr -d '\n')
          KEY_PASS=$(echo "${{ secrets.ANDROID_KEY_PASSWORD }}" | tr -d '\r' | tr -d '\n')

          $BUILD_TOOLS_PATH/apksigner sign \
            --ks release-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            "$APK_PATH"

          # Each release has its own immutable download URL.
          APK_DIR=$(dirname "$APK_PATH")
          mv "$APK_PATH" "$APK_DIR/trans-dev.apk"
          echo "SIGNED_APK_PATH=$APK_DIR/trans-dev.apk" >> $GITHUB_ENV

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: trans-dev-${{ github.run_number }}
          path: ${{ env.SIGNED_APK_PATH }}

      - name: Create Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Trans ${{ env.DEV_VERSION }}
          body: |
            Development APK built from ${{ github.sha }}.
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          make_latest: false
          fail_on_unmatched_files: true
          prerelease: true
          files: ${{ env.SIGNED_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
