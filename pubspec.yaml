name: trans
description: "A new Flutter project."
publish_to: "none"

version: 2.5.1+14

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  intl: ^0.20.2
  http: ^1.1.0
  flutter_markdown_plus: ^1.0.7
  geolocator: ^14.0.2
  geolocator_linux: ^0.2.1
  flutter_compass: ^0.8.0
  cupertino_icons: ^1.0.2

  vibration: ^3.1.0
  super_clipboard: ^0.9.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

  shared_preferences: ^2.2.0
  path_provider: ^2.1.5

  supabase_flutter: ^2.0.0
  image_picker: ^1.0.7
  flutter_dotenv: ^6.0.0
  app_links: ^6.4.1

  # UPDATED VERSION
  dynamic_color: ^1.6.0
  emoji_picker_flutter: ^4.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  # NEW: For Private Chat Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.7
  flutter_image_compress: ^2.4.0
  url_launcher: ^6.2.0
  package_info_plus: ^9.0.0
  uuid: ^4.5.3
  qr_flutter: ^4.1.0

  # Ticket Logic
  google_mlkit_barcode_scanning: ^0.14.2
  image_cropper: ^11.0.0
  image: ^4.8.0
  file_picker: ^11.0.2
  mime: ^2.0.0
  # Linux/Desktop Support
  zxing_lib: ^1.1.4
  crop_your_image: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  peanut: ^6.0.0

# FIX: Override with fork that includes 16KB-aligned prebuilt native binaries
# (irondash_engine_context v0.5.5 ships 4KB-aligned .so files; this fork provides
#  16KB-aligned versions required for Android 15+)
dependency_overrides:
  super_clipboard:
    git:
      url: https://github.com/dilumdesilva/super_native_extensions.git
      path: super_clipboard
  super_native_extensions:
    git:
      url: https://github.com/dilumdesilva/super_native_extensions.git
      path: super_native_extensions
  irondash_engine_context:
    git:
      url: https://github.com/dilumdesilva/super_native_extensions.git
      path: irondash_vendored/engine_context/dart

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#ffffff"
    theme_color: "#0175C2"
  macos:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
  linux:
    generate: true
    image_path: "assets/icon.png"
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  default-flavor: stable
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/sounds/
    - lib/assets/
    - .env
    - lib/assets/logo.png
